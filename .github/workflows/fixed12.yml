name: Fixed 12 Azerbaijan IPTV Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "31 */3 * * *"
  push:
    branches: [main]
    paths:
      - "config/az-fixed12.json"
      - "src/tools/collectRecentSites.ts"
      - ".github/workflows/fixed12.yml"

permissions:
  contents: write

concurrency:
  group: fixed12-iptv
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install chromium
      - name: Collect original M3U8 links (NO playback/HTTP/video validation)
        run: npx tsx src/tools/collectRecentSites.ts
      - name: Validate playlist metadata and fixed channel order only
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('config/az-fixed12.json','utf8'));
          const report=JSON.parse(fs.readFileSync('output/recent-site-status.json','utf8'));
          const m3u=fs.readFileSync('output/azerbaijan-fixed.m3u','utf8');
          const fixed=cfg.channels.map(s=>s.id);
          if(cfg.channels.length!==12||report.slots.length!==12)throw Error('Twelve fixed slots required');
          if(!report.slots.every((r,i)=>r.id===fixed[i]&&r.order===i+1))throw Error('Station order changed');
          if(/yoda/i.test(m3u))throw Error('Yoda not allowed');
          const ids=[...m3u.matchAll(/tvg-id="([^"]+)"/g)].map(m=>m[1]);
          if(ids.length!==report.found)throw Error('Unexpected M3U channel count');
          if(ids.some((id,i)=>!fixed.includes(id)||(i>0&&fixed.indexOf(id)<=fixed.indexOf(ids[i-1]))))throw Error('Channel mismatch');
          const urls=m3u.split('\n').filter(l=>/^https?:\/\//.test(l));
          if(urls.some(x=>!new URL(x).pathname.toLowerCase().endsWith('.m3u8')))throw Error('Non-HLS URL');
          console.log('Original site media URLs captured with no video testing:',ids.join(', '));
          NODE
      - name: Preserve source report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recent-sources-${{ github.run_id }}
          path: |
            output/recent-site-status.json
            output/az-fixed12-status.json
            output/azerbaijan-fixed.m3u
            output/azerbaijan-fixed.html
          retention-days: 14
          if-no-files-found: warn
      - name: Audit metadata only
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$(grep -c '^#EXTINF' output/azerbaijan-fixed.m3u || true)" -gt 0 ]; then
            npm run audit
          fi
      - name: Commit source-based M3U and diagnostics
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in output/recent-site-status.json output/az-fixed12-status.json output/azerbaijan-fixed.m3u output/azerbaijan-fixed.html output/playlist.m3u output/azerbaijan-manual.m3u output/priority-test.m3u output/status.json output/mandatory-health.json output/channel-health.json; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Capture original iCanlive and OperativMM streams without video checks"
          git pull --rebase origin main
          git push origin HEAD:main
