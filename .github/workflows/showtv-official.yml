name: Inspect official Show TV live player
on:
  push:
    branches: [feat/showtv-official-live-20261023]
    paths: [src/tools/inspectShowTvOfficial.ts, .github/workflows/showtv-official.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npx tsx src/tools/inspectShowTvOfficial.ts
      - name: Save Show TV official player network details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showtv-network-${{ github.run_id }}
          path: output/showtv-official-inspect.json
          retention-days: 1
          if-no-files-found: warn
