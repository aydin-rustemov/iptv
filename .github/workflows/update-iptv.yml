name: Update IPTV Channels

on:
  schedule:
    - cron: '0 */3 * * *'  # Runs every 3 hours
  workflow_dispatch:        # Allows manual trigger at any time

concurrency:
  group: iptv-orchestrator
  cancel-in-progress: true

jobs:
  update-streams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPTV Stream Orchestrator
        run: |
          python run.py

      - name: Commit and Push Updated Channels
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage updated playlist and report files
          git add player.m3u report.json
          if [ -d "output" ]; then
            git add output/player.m3u
          fi
          
          # Check if there are any changes staged
          if git diff --staged --quiet; then
            echo "No changes in streams or channels. Clean run."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Auto-update IPTV channels: ${TIMESTAMP} [skip ci]"
            git pull --rebase origin $(git branch --show-current)
            git push origin $(git branch --show-current)
            echo "Successfully updated and pushed new playlists to repository."
          fi
