name: Bootstrap Turkey from Volo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/bootstrapTurkeyFromVolo.ts"
      - ".github/workflows/bootstrap-turkey-volo.yml"

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VOLO_BOOTSTRAP_CONCURRENCY: "8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Rebuild Turkey block from Volo
        run: npx tsx scripts/bootstrapTurkeyFromVolo.ts

      - name: Audit rebuilt playlist
        run: npm run audit

      - name: Commit Volo Turkey baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/playlist.m3u output/playlist.previous.m3u output/turkey-volo-bootstrap.json
          if git diff --cached --quiet; then
            echo "No Turkey baseline changes"
          else
            git commit -m "Rebuild Turkey playlist from Volo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
