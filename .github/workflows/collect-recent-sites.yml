name: Capture OperativMM and iCanlive AZ URLs

on:
  push:
    branches: [feat/operativ-icanlive-no-validation-20261023]
    paths: ["src/tools/collectRecentSites.ts", ".github/workflows/collect-recent-sites.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - name: Capture actual media links without video validation
        run: npx tsx src/tools/collectRecentSites.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-captured-${{ github.run_id }}
          path: |
            output/recent-site-status.json
            output/azerbaijan-fixed.m3u
          if-no-files-found: warn
          retention-days: 7
