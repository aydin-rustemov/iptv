name: Update Direct IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: direct-playlist-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install streamlink
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Generate direct official playlists
        run: npm run direct:update

      - name: Audit direct playlist
        run: npm run direct:audit

      - name: Commit changed playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/playlist-direct.m3u output/playlist-direct-az.m3u output/playlist-direct-tr.m3u output/playlist-direct-ru.m3u output/playlist-direct-europe.m3u output/playlist-direct-americas.m3u output/playlist-direct-middle-east.m3u output/playlist-direct-asia.m3u output/playlist-direct-international.m3u output/direct-status.json output/direct-status.html data/direct-health-history.json
          if git diff --cached --quiet; then
            echo "Playlist changed: no"
          else
            git commit -m "Refresh direct official IPTV playlist"
            git push
            echo "Playlist changed: yes"
          fi
