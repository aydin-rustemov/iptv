name: Update IPTV Playlist

# Manual-mode maintenance: user requested to repair the AZ player first.
# Resume scheduled discovery only after Azerbaijan device playback is confirmed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curated-iptv-playlist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IPTV_MEDIA_CONCURRENCY: "12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright Chromium for real player-network capture
        run: npx playwright install chromium

      - name: Rebuild playlist from Volo and other live-TV websites
        env:
          IPTV_WEB_MAX_PAGES_PER_SOURCE: "35"
          IPTV_WEB_PAGE_CONCURRENCY: "8"
          IPTV_WEB_SOURCE_CONCURRENCY: "3"
        run: npm run update

      - name: Test and audit playlist
        run: |
          npm test
          npm run audit

      - name: Verify publication fits GitHub limits
        run: |
          test "$(wc -c < output/playlist.m3u)" -le 8388608
          test "$(wc -c < output/playlist.previous.m3u)" -le 8388608

      # Always preserve the scan results, including when a later publish step fails.
      # A workflow's green/red state alone must not hide channel-level failures.
      - name: Upload channel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/az-six-health.json
            output/yoda-status.json
            output/channel-health.json
            output/mandatory-health.json
            output/status.json

      # The Yoda AZ catalogue is region locked. User explicitly wants its
      # discovered M3U links included without a US GitHub playback probe.
      # An HTML page is NEVER a playlist URL. Do not block the build solely
      # because Yoda streams have skipped health checks.
      - name: Release gate for Yoda regional TV mode
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const yoda = JSON.parse(fs.readFileSync('output/yoda-status.json', 'utf8'));
          const health = JSON.parse(fs.readFileSync('output/mandatory-health.json', 'utf8'));
          const count = yoda.entries?.length ?? 0;
          const missing = ['arb', 'real-tv', 'medeniyyet-tv', 'ictimai-tv', 'xezer-tv', 'space-tv']
            .filter(id => !health.verified?.includes(id) && !health.needsLocalTest?.includes(id));
          console.log('[YODA AZ-ONLY] From Yoda:', count, 'catalogue:', yoda.catalogued);
          if (missing.length) console.warn('[AZ REGIONAL MISSING] Source has no extracted M3U:', missing.join(', '));
          // Never replace a public playlist with a fake list when all Yoda
          // candidate discovery is broken (or source is totally unavailable).
          if (!count) {
            console.error('[RELEASE BLOCKED] No Yoda M3U candidate was actually discovered.');
            process.exit(1);
          }
          NODE

      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/mandatory-health.json output/az-six-health.json output/yoda-status.json
          for file in \
            config/sources.json \
            output/playlist.m3u \
            output/status.json \
            output/status.html \
            output/missing-priority-channels.json \
            output/missing-priority-details.json \
            output/playlist.previous.m3u \
            output/channel-health.json \
            output/az-six-health.json \
            output/yoda-status.json \
            output/canlitv-status.json \
            state/channel-registry.json; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Maintain working IPTV playlist incrementally"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
