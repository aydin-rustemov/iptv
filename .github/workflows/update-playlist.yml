name: Update IPTV Playlist

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-playlist.yml"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IPTV_WEB_MAX_PAGES_PER_SOURCE: "600"
      IPTV_WEB_PAGE_CONCURRENCY: "6"
      IPTV_WEB_SOURCE_CONCURRENCY: "2"
      IPTV_MAX_CANDIDATES: "5000"
      IPTV_MEDIA_CONCURRENCY: "12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Update playlist incrementally
        run: npm run update

      - name: Audit playlist structure
        run: npm run audit

      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in \
            config/sources.json \
            output/playlist.m3u \
            output/status.json \
            output/status.html \
            output/missing-priority-channels.json \
            output/missing-priority-details.json \
            output/playlist.previous.m3u \
            output/channel-health.json \
            output/canlitv-status.json \
            state/channel-registry.json; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Maintain working IPTV playlist incrementally"
            git push
          fi
