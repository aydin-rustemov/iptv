name: Update IPTV Playlist

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-playlist.yml"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: curated-iptv-playlist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IPTV_MEDIA_CONCURRENCY: "12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild compact regional playlist from verified streams
        run: npm run update

      - name: Test and audit playlist
        run: |
          npm test
          npm run audit

      - name: Verify publication fits GitHub limits
        run: |
          test "$(wc -c < output/playlist.m3u)" -le 8388608
          test "$(wc -c < output/playlist.previous.m3u)" -le 8388608

      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in \
            config/sources.json \
            output/playlist.m3u \
            output/status.json \
            output/status.html \
            output/missing-priority-channels.json \
            output/missing-priority-details.json \
            output/playlist.previous.m3u \
            output/channel-health.json \
            output/canlitv-status.json \
            state/channel-registry.json; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Maintain working IPTV playlist incrementally"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
